[package]
name = "mirror-wtransport"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Native WebTransport server/client used by the Mirror WebTransport transport"

[lib]
name = "mirror_wtransport"
# rlib as well as cdylib so `cargo test` can build a test harness.
crate-type = ["cdylib", "rlib"]

[dependencies]
# aws-lc-rs rather than the default ring: it is AWS's BoringSSL derivative and
# carries better hand-written assembly for AES-GCM on x86-64 and aarch64, which
# is what a server's bulk traffic spends its crypto budget on. wtransport picks
# the provider purely from this feature, so nothing in our code changes.
#
# It does cost more at BUILD time than ring: aws-lc-sys compiles C, so the
# machine needs CMake and a C compiler, plus NASM on Windows x86-64. Swap this
# back to "ring" for a pure-Rust build with no native prerequisites.
wtransport = { version = "0.7.2", default-features = false, features = ["aws-lc-rs", "self-signed", "dangerous-configuration"] }
tokio = { version = "1.28", default-features = false, features = ["rt-multi-thread", "sync", "time", "macros"] }
# Needed to back-date notBefore and to set an explicit validity window on the
# self signed certificate. Same major.minor as wtransport uses, so cargo
# resolves both to one copy.
time = "0.3.21"

# NOTE: panic must stay "unwind". Every exported function wraps its body in
# catch_unwind so a Rust panic surfaces as an error code instead of taking the
# whole Unity process down with it.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
